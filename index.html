<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria ETEC Lauro Gomes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#1c1f24;--mute:#6c727a;--paper:#eceef0;--line:#c9cdd2;--blue:#1d3fa8;--serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#d9dbde;color:var(--ink);font-family:var(--sans);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button,select,input{font:500 14px var(--sans);color:var(--ink)}
button{background:#fff;border:1px solid var(--line);border-radius:3px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.pri:hover{background:#15308a}
#top{position:fixed;z-index:4;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:14px 24px;opacity:0;transition:opacity .8s}
body.in #top{opacity:1}
#top b{font:500 18px var(--serif);letter-spacing:.01em}
#lbl{position:fixed;z-index:4;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:min(340px,calc(100vw - 48px));background:#fff;padding:18px 20px;border-left:3px solid var(--blue);transform:translateY(16px);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,.7,.2,1)}
#lbl.show{transform:none;opacity:1;pointer-events:auto}
#lbl h2{margin:0 0 4px;font:500 24px/1.15 var(--serif)}#lbl p{margin:0 0 12px;color:var(--mute);font-size:14px}
#top div{display:flex;gap:8px}
#lbl .lk{display:flex;gap:8px;margin-bottom:10px}#lbl .lk button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#cm{max-height:130px;overflow:auto;margin:0 0 10px;padding:0;list-style:none;font-size:13px}#cm:empty{display:none}#cm li{padding:6px 0;border-top:1px solid var(--paper)}#cm b{font-weight:600}
#lbl .row{display:flex;gap:6px}#lbl input{background:#fff;color:var(--ink);flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:3px;font-size:13px}
#rk{position:fixed;z-index:5;top:calc(64px + env(safe-area-inset-top,0px));right:24px;width:270px;background:#fff;border:1px solid var(--line);padding:12px;display:none;font-size:14px}#rk.open{display:block}
#rk button{display:flex;justify-content:space-between;width:100%;border:0;text-align:left;padding:8px}#rk button:hover{background:var(--paper)}
#mode{position:fixed;z-index:4;right:24px;bottom:calc(44px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mute)}
#pod{position:fixed;z-index:12;inset:0;background:#eceef0f4;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px)}#pod.open{display:flex}
#pod h2{font:400 clamp(28px,5vw,52px) var(--serif);margin:0 0 4vh;letter-spacing:-.01em}
#pc{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:24px}
#pdm{display:flex;align-items:flex-end;gap:clamp(12px,3vw,40px);max-width:100%}
.pc{display:flex;flex-direction:column;align-items:center;width:clamp(96px,27vw,270px)}
.pc .fr{position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;box-sizing:border-box;padding:6px;background:#f5f5f3;border:7px solid var(--fc);opacity:0;cursor:pointer}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc .sh{position:absolute;inset:0;background:linear-gradient(100deg,transparent 38%,#fffb 50%,transparent 62%);transform:translateX(-130%);pointer-events:none}
.pc .cap{text-align:center;margin:12px 0;opacity:0;min-height:46px}.cap b{font:500 clamp(15px,2vw,20px) var(--serif);display:block}.cap span{font-size:13px;color:var(--mute)}
.pc .ped{width:100%;transform-origin:bottom;transform:scaleY(0);display:flex;justify-content:center;padding-top:12px;font:400 clamp(28px,4vw,48px) var(--serif);color:#fff;background:var(--pf)}
.pc.b{--fc:#a5622f;--pf:linear-gradient(#b87642,#8a4f24)}.pc.s{--fc:#aab0b8;--pf:linear-gradient(#c5cad0,#8f969e)}
.pc.g .fr{border-color:transparent;background:linear-gradient(#f5f5f3,#f5f5f3) padding-box,linear-gradient(135deg,#fff3b0,#d9ac2f 28%,#8a6510 52%,#f6d868 74%,#b8871d) border-box}
.pc.g .ped{color:#fff8dc;background:linear-gradient(135deg,#f6d868,#c8951f 50%,#8a6510)}
#bar{position:fixed;z-index:4;right:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:2px;background:var(--line);opacity:0;transition:opacity .8s}
body.in #bar{opacity:1}#bar i{display:block;height:100%;width:0;background:var(--ink)}
#hero{position:fixed;z-index:6;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(24px,6vw,80px) calc(9vh + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,#eceef0ee 0%,#eceef0aa 45%,transparent 75%);transition:opacity 1s,visibility 1s}
body.in #hero{opacity:0;visibility:hidden}
#hero h1{margin:0;font:400 clamp(44px,9vw,132px)/.95 var(--serif);letter-spacing:-.025em;max-width:11ch}
#hero p{margin:20px 0 28px;max-width:44ch;font-size:17px;line-height:1.5;color:#3b4148}
#hero button{align-self:flex-start;padding:13px 26px;font-size:15px}
#studio{position:fixed;z-index:10;inset:0;background:var(--paper);display:none;grid-template-columns:168px 1fr 300px;grid-template-rows:52px 1fr;padding-top:env(safe-area-inset-top,0px)}
#studio.open{display:grid;animation:up .35s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#sh{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}
#sh strong{font:500 17px var(--serif);margin-right:auto}
#tl{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:2px;background:#fff;overflow:auto}
#tl button{border:0;text-align:left;background:none;padding:9px 10px;border-radius:3px;color:#3b4148}
#tl button.on{background:var(--ink);color:#fff}#tl button:hover:not(.on){background:var(--paper)}
#stage{display:flex;padding:20px;min-width:0;min-height:0;overflow:auto}
#wrap{position:relative;margin:auto;flex:none;line-height:0;width:calc(min(100%,(100vh - 130px)*1.3333)*var(--z,1))}
#gd{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(#0003 1px,transparent 1px),linear-gradient(90deg,#0003 1px,transparent 1px);background-size:8.3333% 11.111%}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}.two{display:flex;gap:6px}.two input{flex:1;width:0;height:34px;padding:0;border:1px solid var(--line)}
#ly{list-style:none;margin:6px 0;padding:0;max-height:160px;overflow:auto}#ly li{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);margin-bottom:3px;cursor:pointer;font-size:13px}#ly li.on{background:var(--ink);color:#fff}
.gb{display:flex;flex-wrap:wrap;gap:4px}.gb button{padding:6px 9px;font-size:12px}
#cv{background:#fff;touch-action:none;cursor:crosshair;width:100%;height:auto;display:block;box-shadow:0 1px 2px #0003,0 18px 40px -12px #0004}
#pp{border-left:1px solid var(--line);background:#fff;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
#pp label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
#pp input[type=text],#pp select{padding:9px;border:1px solid var(--line);border-radius:3px;background:#fff;width:100%;box-sizing:border-box}
#sw{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}#sw button{padding:0;aspect-ratio:1;border-radius:2px}
#col{width:100%;height:36px;padding:0;border:1px solid var(--line);background:none}
@media(max-width:820px){#studio{grid-template-columns:1fr;grid-template-rows:52px auto 1fr auto}#sh{grid-column:1}#tl{flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}#tl button{white-space:nowrap}#pp{border-left:0;border-top:1px solid var(--line);max-height:38vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<header id="top"><b>Galeria ETEC Lauro Gomes</b><div><button id="rkb">Ranking</button><button id="artist" class="pri">Criar uma obra</button></div></header><div id="rk"></div><div id="pod"><button id="pc">Fechar</button><h2>Obras mais curtidas</h2><div id="pdm"></div></div><div id="mode"></div>
<aside id="lbl"><h2></h2><p></p><div class="lk"><button id="like"></button><button id="back">Voltar</button><button id="del" hidden>Remover</button></div><ul id="cm"></ul><div class="row"><input id="cn" placeholder="Nome" maxlength="20" style="max-width:88px"><input id="ct" placeholder="Deixe um comentário" maxlength="140"><button id="cs">Enviar</button></div></aside>
<div id="bar"><i></i></div>
<section id="hero"><h1>Galeria Lauro Gomes</h1><p>Obras dos alunos da ETEC, expostas numa sala que você percorre. Curta, comente e pendure a sua.</p><p id="theme" style="margin:-8px 0 28px;font-weight:600"></p><button id="enter" class="pri">Entrar na sala</button></section>

<div id="studio">
 <div id="sh"><strong>Estúdio</strong><button id="undo">Desfazer</button><button id="redo">Refazer</button><button id="clear">Limpar camada</button><label class="chk"><input type="checkbox" id="grid">Grade</label><label class="chk"><input type="checkbox" id="fill">Preencher formas</label><button id="close">Fechar</button></div>
 <nav id="tl"></nav>
 <div id="stage"><div id="wrap"><canvas id="cv" width="1200" height="900"></canvas><div id="gd"></div></div></div>
 <div id="pp">
  <p id="th" style="margin:0;font:500 17px/1.3 var(--serif)"></p>
  <div><div class="two"><input type="color" id="col" value="#1d3fa8" title="Cor 1"><input type="color" id="col2" value="#f0b429" title="Cor 2"><button id="swap">Trocar</button></div><div id="sw" style="margin-top:8px"></div></div>
  <label>Tamanho <input type="range" id="sz" min="1" max="120" value="12"></label>
  <label>Opacidade <input type="range" id="op" min="5" max="100" value="100"></label>
  <label>Estabilização do traço <input type="range" id="sm" min="0" max="90" value="30"></label>
  <label>Simetria<select id="sy"><option value="0">Nenhuma</option><option value="1">Espelho vertical</option><option value="2">Espelho horizontal</option><option value="3">Quatro lados</option></select></label>
  <label>Zoom <input type="range" id="zm" min="40" max="200" value="100"></label>
  <div><b style="font-size:13px">Camadas</b><ul id="ly"></ul>
   <div class="gb"><button id="ladd">Nova</button><button id="ldup">Duplicar</button><button id="ldel">Excluir</button><button id="lup">Subir</button><button id="ldn">Descer</button></div>
   <label style="margin-top:8px">Mistura da camada<select id="bl"><option value="source-over">Normal</option><option value="multiply">Multiplicar</option><option value="screen">Tela</option><option value="overlay">Sobrepor</option><option value="darken">Escurecer</option><option value="lighten">Clarear</option><option value="color-dodge">Subexpor</option></select></label>
   <label>Opacidade da camada <input type="range" id="lo" min="0" max="100" value="100"></label></div>
  <div><label>Filtro na camada<select id="fl"><option value="blur(5px)">Desfocar</option><option value="grayscale(1)">Tons de cinza</option><option value="invert(1)">Inverter cores</option><option value="sepia(.9)">Sépia</option><option value="saturate(2)">Saturar</option><option value="hue-rotate(90deg)">Girar matiz</option><option value="brightness(1.25)">Clarear</option><option value="contrast(1.4)">Contraste</option></select></label><button id="fa" style="margin-top:6px">Aplicar filtro</button></div>
  <label>Importar imagem<input type="file" id="im" accept="image/*"></label>
  <label>Moldura<select id="fs"><option value="oak">Carvalho</option><option value="black">Preta</option><option value="white">Branca</option><option value="brass">Latão</option></select></label>
  <label>Título<input type="text" id="tt" placeholder="Nome da obra" maxlength="40"></label>
  <label>Autor<input type="text" id="au" placeholder="Seu nome" maxlength="30"></label>
  <button id="save" class="pri">Pendurar na galeria</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),KEY='etec-galeria-v2';
const FR={oak:[0x8a6238,.7,0],black:[0x18191b,.5,.2],white:[0xf3f3f1,.6,0],brass:[0xb08d4a,.35,.85]};
const THEMES=['Minha escola em cores','Um lugar que me faz bem','Futuro','Máquinas e pessoas','Silêncio','Meu bairro','Sonho','Autorretrato sem rosto','Movimento','Noite'];
const THEME=THEMES[Math.floor(Date.now()/6048e5)%THEMES.length];
const LK='etec-galeria-v3',D={obras:[],likes:[],coms:[]};let db=null,uid='local',canMod=false,shared=false,sig=null,fa=null;
try{Object.assign(D,JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){}
const lsave=()=>{try{localStorage.setItem(LK,JSON.stringify(D));return true}catch(e){return false}};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function put(k,o){o.id=o.id||newId();if(db){try{await db.collection(k).doc(o.id).set(o)}catch(e){return false}}else{D[k].push(o);if(!lsave()){D[k].pop();return false}refresh()}return true}
async function del(k,id){if(db){try{await db.collection(k).doc(id).delete()}catch(e){}}else{D[k]=D[k].filter(o=>o.id!==id);lsave();refresh()}}
const likesOf=a=>D.likes.filter(l=>l.obra===a.id).length;
const mode=()=>$('#mode').textContent=shared?'Obras, curtidas e comentários compartilhados':'Tudo fica salvo neste computador';
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tex(c,rep){const t=new THREE.CanvasTexture(c);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep)}return t}

// ---------- sala ----------
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.background=new THREE.Color(0xdcdee1);S.fog=new THREE.Fog(0xdcdee1,14,46);
const cam=new THREE.PerspectiveCamera(55,1,.1,80);
S.add(new THREE.HemisphereLight(0xffffff,0xb9a58c,.75));
const W=4.5,H=4.4,LEN=120;
// piso de tábuas
const fc=cvs(512,512),fg=fc.getContext('2d');
for(let i=0;i<8;i++){fg.fillStyle=`hsl(32,${32+Math.random()*8}%,${58+Math.random()*10}%)`;fg.fillRect(i*64,0,64,512);
  for(let k=0;k<40;k++){fg.fillStyle=`hsla(30,30%,30%,${Math.random()*.06})`;fg.fillRect(i*64+Math.random()*64,0,1,512)}
  fg.fillStyle='#0003';fg.fillRect(i*64,0,1.5,512);fg.fillRect(i*64,Math.random()*512,64,1.5)}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W*2,LEN),new THREE.MeshStandardMaterial({map:tex(fc,[2,LEN/8]),roughness:.45,metalness:.05}));
floor.rotation.x=-Math.PI/2;floor.position.z=-LEN/2+12;S.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W*2,LEN),new THREE.MeshStandardMaterial({color:0xf4f4f4}));
ceil.rotation.x=Math.PI/2;ceil.position.set(0,H,-LEN/2+12);S.add(ceil);
const wm=new THREE.MeshStandardMaterial({color:0xe8e9eb,roughness:.95});
const bm=new THREE.MeshStandardMaterial({color:0xf7f7f7,roughness:.6});
[-1,1].forEach(s=>{const w=new THREE.Mesh(new THREE.PlaneGeometry(LEN,H),wm);w.rotation.y=-s*Math.PI/2;w.position.set(s*W,H/2,-LEN/2+12);S.add(w);
  const b=new THREE.Mesh(new THREE.BoxGeometry(.06,.2,LEN),bm);b.position.set(s*(W-.03),.1,-LEN/2+12);S.add(b)});
const endW=new THREE.Mesh(new THREE.PlaneGeometry(W*2,H),wm);endW.position.set(0,H/2,-LEN+12);S.add(endW);
// banco central
const bench=new THREE.Mesh(new THREE.BoxGeometry(1.1,.45,3),new THREE.MeshStandardMaterial({color:0x2a2c30,roughness:.7}));
const seatTop=new THREE.Mesh(new THREE.BoxGeometry(1.2,.08,3.1),new THREE.MeshStandardMaterial({color:0x8a6238,roughness:.6}));
bench.position.set(0,.22,-16);seatTop.position.set(0,.48,-16);S.add(bench,seatTop);
// spots que acompanham a câmera
const spots=[];for(let i=0;i<6;i++){const sp=new THREE.SpotLight(0xfff1dc,1.5,16,.55,.7,1.4);sp.target=new THREE.Object3D();S.add(sp,sp.target);spots.push(sp)}
const fixt=new THREE.InstancedMesh(new THREE.CylinderGeometry(.07,.09,.16,12),new THREE.MeshStandardMaterial({color:0x222}),LEN/2.5*2);
// sombra suave sob cada moldura
const shc=cvs(128,128),sg=shc.getContext('2d'),gr=sg.createRadialGradient(64,64,20,64,64,64);gr.addColorStop(0,'rgba(0,0,0,.34)');gr.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=gr;sg.fillRect(0,0,128,128);
const shTex=tex(shc);

// ---------- obras ----------
function paint(seed){
  const c=cvs(600,450),g=c.getContext('2d');let r=seed*7919;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const pal=[[.58,.55,.32],[.06,.7,.5],[.1,.05,.9],[.62,.6,.18],[.02,.65,.45],[.13,.7,.6]][seed%6];
  const hs=(dh,s,l)=>`hsl(${(pal[0]*360+dh)%360},${s*100}%,${l*100}%)`;
  g.fillStyle=hs(0,.12,.92);g.fillRect(0,0,600,450);
  const t=seed%4;
  if(t===0){const n=3+(rnd()*2|0);let y=0;for(let i=0;i<n;i++){const h=450/n*(.7+rnd()*.6);g.fillStyle=hs(i*25,pal[1],.3+rnd()*.35);g.fillRect(40,40+y,520,Math.min(h,410-y));y+=h}}
  else if(t===1){for(let i=0;i<7;i++){g.fillStyle=hs(rnd()*60,pal[1],.25+rnd()*.5);const s=60+rnd()*160;g.fillRect(rnd()*440,rnd()*300,s,s*(.4+rnd()))}g.fillStyle='#1c1f24';g.fillRect(rnd()*400,0,5,450)}
  else if(t===2){for(let i=0;i<9;i++){g.strokeStyle=hs(i*12,pal[1],.3+i*.05);g.lineWidth=18+rnd()*20;g.beginPath();g.arc(300,520,80+i*46,Math.PI*1.1,Math.PI*1.9);g.stroke()}}
  else{for(let i=0;i<26;i++){g.strokeStyle=hs(rnd()*50,pal[1],.2+rnd()*.6);g.lineWidth=4+rnd()*26;g.globalAlpha=.7;g.beginPath();const y=rnd()*450;g.moveTo(-20,y);g.bezierCurveTo(200,y+rnd()*90-45,400,y+rnd()*90-45,620,y+rnd()*60-30);g.stroke()}g.globalAlpha=1}
  const im=g.getImageData(0,0,600,450);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*14;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}g.putImageData(im,0,0);
  return c}
function emptyArt(){const c=cvs(600,450),g=c.getContext('2d');g.fillStyle='#f0f1f2';g.fillRect(0,0,600,450);g.strokeStyle='#9aa0a7';g.lineWidth=6;g.beginPath();g.moveTo(300,170);g.lineTo(300,280);g.moveTo(245,225);g.lineTo(355,225);g.stroke();g.fillStyle='#6c727a';g.font='500 30px Instrument Sans, sans-serif';g.textAlign='center';g.fillText('Sua obra aqui',300,350);return c}
function plaque(a){const c=cvs(300,150),g=c.getContext('2d');g.fillStyle='#fafafa';g.fillRect(0,0,300,150);
  g.fillStyle='#1c1f24';g.font='500 26px Newsreader, Georgia, serif';g.fillText(a.title.slice(0,22),18,62);
  g.fillStyle='#6c727a';g.font='400 19px Instrument Sans, sans-serif';g.fillText(a.author.slice(0,26),18,98);return tex(c)}
const frames=[],pick=[];
function addFrame(a,i){
  const side=i%2?1:-1,z=-5-Math.floor(i/2)*6,g=new THREE.Group(),f=FR[a.style]||FR.oak;
  const fm=new THREE.MeshStandardMaterial({color:f[0],roughness:f[1],metalness:f[2]});
  const T=.14,fw=3.3,fh=2.6;

$('#clear').onclick=()=>{push();x.clearRect(0,0,CW,CH);if(ai===0){x.fillStyle='#fff';x.fillRect(0,0,CW,CH)}draw()};
$('#swap').onclick=()=>{[$('#col').value,$('#col2').value]=[$('#col2').value,$('#col').value]};
$('#zm').oninput=()=>$('#wrap').style.setProperty('--z',$('#zm').value/100);
$('#grid').onchange=()=>$('#gd').style.display=$('#grid').checked?'block':'none';
$('#fa').onclick=()=>{push();const t=cvs(CW,CH);t.getContext('2d').drawImage(L[ai].c,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.clearRect(0,0,CW,CH);x.filter=$('#fl').value;x.drawImage(t,0,0);x.filter='none';draw()};
$('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(CW/im.width,CH/im.height),n=mkLayer('Imagem');n.c.getContext('2d').drawImage(im,(CW-im.width*k)/2,(CH-im.height*k)/2,im.width*k,im.height*k);L.splice(ai+1,0,n);setActive(ai+1);draw();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f);e.target.value=''};
addEventListener('keydown',e=>{if(!$('#studio').classList.contains('open')||['INPUT','SELECT'].includes(e.target.tagName))return;const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='y')){e.preventDefault();(k==='y'||e.shiftKey)?$('#redo').click():$('#undo').click();return}
  const m={b:'pincel',p:'lapis',a:'aero',e:'borracha',g:'balde',i:'gotas',l:'linha',r:'ret',o:'elipse',t:'texto'};if(m[k]&&!e.ctrlKey&&!e.metaKey)selTool(m[k]);
  if(k==='[')$('#sz').value=+$('#sz').value-4;if(k===']')$('#sz').value=+$('#sz').value+4;if(k==='x')$('#swap').click()});
$('#artist').onclick=()=>$('#studio').classList.add('open');$('#close').onclick=()=>$('#studio').classList.remove('open');
$('#save').onclick=async()=>{comp();const o=cvs(CW,CH),g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,CW,CH);g.drawImage(cv,0,0);const im=cvs(800,600);im.getContext('2d').drawImage(o,0,0,800,600);
  const a={title:$('#tt').value.trim()||'Sem título',author:$('#au').value.trim()||'Autor anônimo',style:$('#fs').value,img:im.toDataURL('image/jpeg',.72),ts:Date.now(),uid,tema:THEME};
  if(!await put('obras',a)){alert('Não foi possível salvar a obra. O armazenamento do navegador pode estar cheio.');return}
  $('#studio').classList.remove('open');resetLayers();$('#tt').value='';setTimeout(()=>{const n=arts.find(o=>o.id===a.id);if(n)goTo(n)},900)};
resetLayers();
$('#theme').textContent='Tema desta semana: '+THEME+'.';$('#th').textContent='Tema da semana: '+THEME;
refresh();mode();
(async()=>{try{const c=await claude.use('db'),u=await claude.use('user');if(!c||!u)return;uid=await u.id();canMod=u.canEdit();db=c;shared=true;mode();
 ['obras','likes','coms'].forEach(k=>db.collection(k).onSnapshot(sn=>{D[k]=sn.docs.map(d=>({...d.data(),id:d.id}));refresh()}))}catch(e){db=null;shared=false}})();
</script></body></html>
