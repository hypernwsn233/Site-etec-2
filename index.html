<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria ETEC Lauro Gomes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#1c1f24;--mute:#6c727a;--paper:#eceef0;--line:#c9cdd2;--blue:#1d3fa8;--serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#d9dbde;color:var(--ink);font-family:var(--sans);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button,select,input{font:500 14px var(--sans);color:var(--ink)}
button{background:#fff;border:1px solid var(--line);border-radius:3px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.pri:hover{background:#15308a}
#top{position:fixed;z-index:4;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:14px 24px;opacity:0;transition:opacity .8s}
body.in #top{opacity:1}
#top b{font:500 18px var(--serif);letter-spacing:.01em}
#lbl{position:fixed;z-index:4;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:min(340px,calc(100vw - 48px));background:#fff;padding:18px 20px;border-left:3px solid var(--blue);transform:translateY(16px);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,.7,.2,1)}
#lbl.show{transform:none;opacity:1;pointer-events:auto}
#lbl h2{margin:0 0 4px;font:500 24px/1.15 var(--serif)}#lbl p{margin:0 0 12px;color:var(--mute);font-size:14px}
#bar{position:fixed;z-index:4;right:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:2px;background:var(--line);opacity:0;transition:opacity .8s}
body.in #bar{opacity:1}#bar i{display:block;height:100%;width:0;background:var(--ink)}
#hero{position:fixed;z-index:6;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(24px,6vw,80px) calc(9vh + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,#eceef0ee 0%,#eceef0aa 45%,transparent 75%);transition:opacity 1s,visibility 1s}
body.in #hero{opacity:0;visibility:hidden}
#hero h1{margin:0;font:400 clamp(44px,9vw,132px)/.95 var(--serif);letter-spacing:-.025em;max-width:11ch}
#hero p{margin:20px 0 28px;max-width:44ch;font-size:17px;line-height:1.5;color:#3b4148}
#hero button{align-self:flex-start;padding:13px 26px;font-size:15px}
#studio{position:fixed;z-index:10;inset:0;background:var(--paper);display:none;grid-template-columns:168px 1fr 260px;grid-template-rows:52px 1fr;padding-top:env(safe-area-inset-top,0px)}
#studio.open{display:grid;animation:up .35s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#sh{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}
#sh strong{font:500 17px var(--serif);margin-right:auto}
#tl{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:2px;background:#fff;overflow:auto}
#tl button{border:0;text-align:left;background:none;padding:9px 10px;border-radius:3px;color:#3b4148}
#tl button.on{background:var(--ink);color:#fff}#tl button:hover:not(.on){background:var(--paper)}
#stage{display:flex;align-items:center;justify-content:center;padding:20px;min-width:0;min-height:0}
#cv{background:#fff;touch-action:none;cursor:crosshair;max-width:100%;max-height:100%;aspect-ratio:4/3;box-shadow:0 1px 2px #0003,0 18px 40px -12px #0004}
#pp{border-left:1px solid var(--line);background:#fff;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
#pp label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
#pp input[type=text],#pp select{padding:9px;border:1px solid var(--line);border-radius:3px;background:#fff;width:100%;box-sizing:border-box}
#sw{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}#sw button{padding:0;aspect-ratio:1;border-radius:2px}
#col{width:100%;height:36px;padding:0;border:1px solid var(--line);background:none}
@media(max-width:820px){#studio{grid-template-columns:1fr;grid-template-rows:52px auto 1fr auto}#sh{grid-column:1}#tl{flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}#tl button{white-space:nowrap}#pp{border-left:0;border-top:1px solid var(--line);max-height:38vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<header id="top"><b>Galeria ETEC Lauro Gomes</b><button id="artist" class="pri">Criar uma obra</button></header>
<aside id="lbl"><h2></h2><p></p><button id="back">Voltar ao corredor</button></aside>
<div id="bar"><i></i></div>
<section id="hero"><h1>Galeria Lauro Gomes</h1><p>Obras dos alunos da ETEC, expostas numa sala que você percorre. Depois de olhar, entre no estúdio e pendure a sua.</p><button id="enter" class="pri">Entrar na sala</button></section>

<div id="studio">
 <div id="sh"><strong>Estúdio</strong><button id="undo">Desfazer</button><button id="redo">Refazer</button><button id="clear">Limpar tela</button><button id="close">Fechar</button></div>
 <nav id="tl"></nav>
 <div id="stage"><canvas id="cv" width="1200" height="900"></canvas></div>
 <div id="pp">
  <div><label>Cor<input type="color" id="col" value="#1d3fa8"></label><div id="sw" style="margin-top:8px"></div></div>
  <label>Tamanho <input type="range" id="sz" min="1" max="80" value="10"></label>
  <label>Opacidade <input type="range" id="op" min="5" max="100" value="100"></label>
  <label>Moldura<select id="fs"><option value="oak">Carvalho</option><option value="black">Preta</option><option value="white">Branca</option><option value="brass">Latão</option></select></label>
  <label>Título<input type="text" id="tt" placeholder="Nome da obra" maxlength="40"></label>
  <label>Autor<input type="text" id="au" placeholder="Seu nome" maxlength="30"></label>
  <button id="save" class="pri">Pendurar na galeria</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),KEY='etec-galeria-v2';
const FR={oak:[0x8a6238,.7,0],black:[0x18191b,.5,.2],white:[0xf3f3f1,.6,0],brass:[0xb08d4a,.35,.85]};
const seedArts=[['Sem título nº 4','Turma 2B','oak'],['Circuito aberto','Turma 3A','black'],['Manhã no pátio','Turma 1C','white'],['Ponte','Turma 2A','brass'],['Faixa azul','Turma 3B','oak'],['Estudo de luz','Turma 1A','black'],['Caminho','Turma 2C','white'],['Relevo','Turma 3C','brass']].map((a,i)=>({title:a[0],author:a[1],style:a[2],seed:i+2}));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const persist=s=>{try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){return false}};
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tex(c,rep){const t=new THREE.CanvasTexture(c);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep)}return t}

// ---------- sala ----------
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.background=new THREE.Color(0xdcdee1);S.fog=new THREE.Fog(0xdcdee1,14,46);
const cam=new THREE.PerspectiveCamera(55,1,.1,80);
S.add(new THREE.HemisphereLight(0xffffff,0xb9a58c,.75));
const W=4.5,H=4.4,LEN=120;
// piso de tábuas
const fc=cvs(512,512),fg=fc.getContext('2d');
for(let i=0;i<8;i++){fg.fillStyle=`hsl(32,${32+Math.random()*8}%,${58+Math.random()*10}%)`;fg.fillRect(i*64,0,64,512);
  for(let k=0;k<40;k++){fg.fillStyle=`hsla(30,30%,30%,${Math.random()*.06})`;fg.fillRect(i*64+Math.random()*64,0,1,512)}
  fg.fillStyle='#0003';fg.fillRect(i*64,0,1.5,512);fg.fillRect(i*64,Math.random()*512,64,1.5)}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W*2,LEN),new THREE.MeshStandardMaterial({map:tex(fc,[2,LEN/8]),roughness:.45,metalness:.05}));
floor.rotation.x=-Math.PI/2;floor.position.z=-LEN/2+12;S.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W*2,LEN),new THREE.MeshStandardMaterial({color:0xf4f4f4}));
ceil.rotation.x=Math.PI/2;ceil.position.set(0,H,-LEN/2+12);S.add(ceil);
const wm=new THREE.MeshStandardMaterial({color:0xe8e9eb,roughness:.95});
const bm=new THREE.MeshStandardMaterial({color:0xf7f7f7,roughness:.6});
[-1,1].forEach(s=>{const w=new THREE.Mesh(new THREE.PlaneGeometry(LEN,H),wm);w.rotation.y=-s*Math.PI/2;w.position.set(s*W,H/2,-LEN/2+12);S.add(w);
  const b=new THREE.Mesh(new THREE.BoxGeometry(.06,.2,LEN),bm);b.position.set(s*(W-.03),.1,-LEN/2+12);S.add(b)});
const endW=new THREE.Mesh(new THREE.PlaneGeometry(W*2,H),wm);endW.position.set(0,H/2,-LEN+12);S.add(endW);
// banco central
const bench=new THREE.Mesh(new THREE.BoxGeometry(1.1,.45,3),new THREE.MeshStandardMaterial({color:0x2a2c30,roughness:.7}));
const seatTop=new THREE.Mesh(new THREE.BoxGeometry(1.2,.08,3.1),new THREE.MeshStandardMaterial({color:0x8a6238,roughness:.6}));
bench.position.set(0,.22,-16);seatTop.position.set(0,.48,-16);S.add(bench,seatTop);
// spots que acompanham a câmera
const spots=[];for(let i=0;i<6;i++){const sp=new THREE.SpotLight(0xfff1dc,1.5,16,.55,.7,1.4);sp.target=new THREE.Object3D();S.add(sp,sp.target);spots.push(sp)}
const fixt=new THREE.InstancedMesh(new THREE.CylinderGeometry(.07,.09,.16,12),new THREE.MeshStandardMaterial({color:0x222}),LEN/2.5*2);
// sombra suave sob cada moldura
const shc=cvs(128,128),sg=shc.getContext('2d'),gr=sg.createRadialGradient(64,64,20,64,64,64);gr.addColorStop(0,'rgba(0,0,0,.34)');gr.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=gr;sg.fillRect(0,0,128,128);
const shTex=tex(shc);

// ---------- obras ----------
function paint(seed){
  const c=cvs(600,450),g=c.getContext('2d');let r=seed*7919;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const pal=[[.58,.55,.32],[.06,.7,.5],[.1,.05,.9],[.62,.6,.18],[.02,.65,.45],[.13,.7,.6]][seed%6];
  const hs=(dh,s,l)=>`hsl(${(pal[0]*360+dh)%360},${s*100}%,${l*100}%)`;
  g.fillStyle=hs(0,.12,.92);g.fillRect(0,0,600,450);
  const t=seed%4;
  if(t===0){const n=3+(rnd()*2|0);let y=0;for(let i=0;i<n;i++){const h=450/n*(.7+rnd()*.6);g.fillStyle=hs(i*25,pal[1],.3+rnd()*.35);g.fillRect(40,40+y,520,Math.min(h,410-y));y+=h}}
  else if(t===1){for(let i=0;i<7;i++){g.fillStyle=hs(rnd()*60,pal[1],.25+rnd()*.5);const s=60+rnd()*160;g.fillRect(rnd()*440,rnd()*300,s,s*(.4+rnd()))}g.fillStyle='#1c1f24';g.fillRect(rnd()*400,0,5,450)}
  else if(t===2){for(let i=0;i<9;i++){g.strokeStyle=hs(i*12,pal[1],.3+i*.05);g.lineWidth=18+rnd()*20;g.beginPath();g.arc(300,520,80+i*46,Math.PI*1.1,Math.PI*1.9);g.stroke()}}
  else{for(let i=0;i<26;i++){g.strokeStyle=hs(rnd()*50,pal[1],.2+rnd()*.6);g.lineWidth=4+rnd()*26;g.globalAlpha=.7;g.beginPath();const y=rnd()*450;g.moveTo(-20,y);g.bezierCurveTo(200,y+rnd()*90-45,400,y+rnd()*90-45,620,y+rnd()*60-30);g.stroke()}g.globalAlpha=1}
  const im=g.getImageData(0,0,600,450);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*14;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}g.putImageData(im,0,0);
  return c}
function plaque(a){const c=cvs(300,150),g=c.getContext('2d');g.fillStyle='#fafafa';g.fillRect(0,0,300,150);
  g.fillStyle='#1c1f24';g.font='500 26px Newsreader, Georgia, serif';g.fillText(a.title.slice(0,22),18,62);
  g.fillStyle='#6c727a';g.font='400 19px Instrument Sans, sans-serif';g.fillText(a.author.slice(0,26),18,98);return tex(c)}
const frames=[],pick=[];
function addFrame(a,i){
  const side=i%2?1:-1,z=-5-Math.floor(i/2)*6,g=new THREE.Group(),f=FR[a.style]||FR.oak;
  const fm=new THREE.MeshStandardMaterial({color:f[0],roughness:f[1],metalness:f[2]});
  const T=.14,fw=3.3,fh=2.6;
  [[0,fh/2-T/2,fw,T],[0,-fh/2+T/2,fw,T],[-fw/2+T/2,0,T,fh],[fw/2-T/2,0,T,fh]].forEach(([x,y,w,h])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.14),fm);m.position.set(x,y,.07);g.add(m)});
  const mat=new THREE.Mesh(new THREE.PlaneGeometry(fw-2*T,fh-2*T),new THREE.MeshStandardMaterial({color:0xfbfbf9,roughness:1}));mat.position.z=.03;g.add(mat);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.8),new THREE.MeshBasicMaterial({color:0xddd}));p.position.z=.035;g.add(p);
  if(a.img){new THREE.TextureLoader().load(a.img,t=>{t.encoding=THREE.sRGBEncoding;p.material=new THREE.MeshBasicMaterial({map:t})})}else{const t=tex(paint(a.seed));t.encoding=THREE.sRGBEncoding;p.material=new THREE.MeshBasicMaterial({map:t})}
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(4.4,3.7),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));sh.position.set(.05,-.12,-.02);g.add(sh);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(.5,.25),new THREE.MeshBasicMaterial({map:plaque(a)}));pl.position.set(-side*2.15,-.55,.02);g.add(pl);
  g.position.set(side*(W-.01),2.35,z);g.rotation.y=-side*Math.PI/2;S.add(g);
  p.userData={a,g};pick.push(p);g.userData={side,z,s:1};frames.push(g);a.g=g}
let arts=[];
function build(){frames.splice(0).forEach(f=>S.remove(f));pick.length=0;arts=[...seedArts,...load()];arts.forEach(addFrame)}
build();
const minZ=()=>-5-Math.floor((arts.length-1)/2)*6-4;

// ---------- navegação ----------
const START=26,HOME=6;let tz=START,cz=START,mx=0,my=0,focus=null,hov=null,entered=false;
const look=new THREE.Vector3(0,2.2,-30),lookT=look.clone(),camT=new THREE.Vector3();
$('#enter').onclick=()=>{entered=true;document.body.classList.add('in');tz=HOME};
addEventListener('wheel',e=>{if(entered&&!focus)tz=Math.max(minZ(),Math.min(HOME,tz-e.deltaY*.012))},{passive:true});
addEventListener('keydown',e=>{if($('#studio').classList.contains('open')||!entered)return;
  if(['ArrowUp','w'].includes(e.key))tz=Math.max(minZ(),tz-2.5);if(['ArrowDown','s'].includes(e.key))tz=Math.min(HOME,tz+2.5);if(e.key==='Escape')unfocus()});
let dy=null;addEventListener('pointerdown',e=>dy=e.clientY);addEventListener('pointerup',()=>dy=null);
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;
  if(dy!==null&&entered&&!focus&&e.pointerType==='touch'){tz=Math.max(minZ(),Math.min(HOME,tz+(e.clientY-dy)*.04));dy=e.clientY}
  const h=cast(e);hov=h?h.object.userData.g:null;document.body.style.cursor=hov?'pointer':'default'});
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
function cast(e){if(!entered)return null;v2.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(v2,cam);return ray.intersectObjects(pick)[0]}
$('#c').addEventListener('click',e=>{const h=cast(e);if(!h){unfocus();return}
  const{a,g}=h.object.userData;focus=g;camT.set(g.position.x-g.userData.side*4.1,2.35,g.position.z+.3*g.userData.side*0);lookT.set(g.position.x,2.35,g.position.z);
  $('#lbl h2').textContent=a.title;$('#lbl p').textContent=a.author;$('#lbl').classList.add('show')});
function unfocus(){focus=null;$('#lbl').classList.remove('show')}$('#back').onclick=unfocus;
const ease=(k)=>1-Math.pow(1-k,3);
function loop(t){t*=.001;const dz=entered?.045:.02;cz+=(tz-cz)*dz;
  if(focus){cam.position.lerp(camT,.07);look.lerp(lookT,.07)}
  else if(!entered){cam.position.set(Math.sin(t*.15)*.6,2.3,cz);look.set(0,2.1,cz-14)}
  else{cam.position.lerp(new THREE.Vector3(mx*1.2,2.2-my*.25,cz),.08);look.lerp(new THREE.Vector3(mx*4,2.2-my*.8,cz-12),.08)}
  cam.lookAt(look);
  spots.forEach((sp,i)=>{const side=i%2?1:-1,z=Math.round((cz-3)/6)*6-Math.floor(i/2)*6+3;sp.position.set(side*1.2,H-.1,z);sp.target.position.set(side*W,2.3,z-2)});
  frames.forEach(f=>{const s=f===hov||f===focus?1.03:1;f.userData.s+=(s-f.userData.s)*.1;f.scale.setScalar(f.userData.s)});
  $('#bar i').style.width=Math.max(0,Math.min(1,(HOME-cz)/(HOME-minZ())))*100+'%';
  R.render(S,cam);requestAnimationFrame(loop)}
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();requestAnimationFrame(loop);

// ---------- estúdio ----------
const cv=$('#cv'),x=cv.getContext('2d',{willReadFrequently:true}),CW=1200,CH=900;
let tool='pincel',down=false,lx=0,ly=0,sx=0,sy=0,snap=null,undo=[],redo=[];
const TL=[['pincel','Pincel'],['lapis','Lápis'],['spray','Spray'],['borracha','Borracha'],['balde','Balde de tinta'],['gotas','Conta-gotas'],['linha','Linha'],['ret','Retângulo'],['elipse','Elipse'],['elipsec','Elipse preenchida'],['retc','Retângulo preenchido']];
TL.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.k=k;b.onclick=()=>{tool=k;document.querySelectorAll('#tl button').forEach(n=>n.classList.toggle('on',n===b))};$('#tl').append(b)});$('#tl button').classList.add('on');
['#1c1f24','#ffffff','#b3202a','#e2661f','#f0b429','#2f8f4e','#1d3fa8','#7a3d8c','#8a6238','#8d949c','#f2a7b5','#9ad0e8','#c8d96f','#0e5a5a','#5b3a1e','#e9dcc4'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>$('#col').value=c;$('#sw').append(b)});
const fillWhite=()=>{x.globalAlpha=1;x.fillStyle='#fff';x.fillRect(0,0,CW,CH)};fillWhite();
const snapNow=()=>x.getImageData(0,0,CW,CH);
const push=()=>{undo.push(snapNow());if(undo.length>30)undo.shift();redo=[]};
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height]};
function flood(px,py,hex){const im=snapNow(),d=im.data,i0=((py|0)*CW+(px|0))*4,tg=[d[i0],d[i0+1],d[i0+2]],c=parseInt(hex.slice(1),16),cr=c>>16,cg=c>>8&255,cb=c&255;
  if(tg[0]===cr&&tg[1]===cg&&tg[2]===cb)return;const ok=i=>Math.abs(d[i]-tg[0])+Math.abs(d[i+1]-tg[1])+Math.abs(d[i+2]-tg[2])<60;
  const st=[[px|0,py|0]];while(st.length){const[a,b]=st.pop();if(a<0||b<0||a>=CW||b>=CH)continue;const i=(b*CW+a)*4;if(!ok(i))continue;d[i]=cr;d[i+1]=cg;d[i+2]=cb;d[i+3]=255;st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}x.putImageData(im,0,0)}
function setup(e){const t=tool;x.lineCap=x.lineJoin='round';x.globalAlpha=t==='borracha'?1:$('#op').value/100;x.strokeStyle=x.fillStyle=t==='borracha'?'#fff':$('#col').value}
cv.onpointerdown=e=>{[sx,sy]=lx=ly=pos(e);[lx,ly]=[sx,sy]=pos(e);
  if(tool==='gotas'){const p=x.getImageData(sx|0,sy|0,1,1).data;$('#col').value='#'+[...p].slice(0,3).map(v=>v.toString(16).padStart(2,'0')).join('');return}
  push();if(tool==='balde'){flood(sx,sy,$('#col').value);return}
  down=true;cv.setPointerCapture(e.pointerId);snap=snapNow();setup(e);
  if(tool==='pincel'||tool==='lapis'||tool==='borracha'){x.lineWidth=+$('#sz').value*(tool==='lapis'?.35:1);x.beginPath();x.arc(sx,sy,x.lineWidth/2,0,7);x.fill()}};
cv.onpointermove=e=>{if(!down)return;const[px,py]=pos(e),w=+$('#sz').value;
  if(['pincel','lapis','borracha'].includes(tool)){const pr=e.pointerType==='pen'?Math.max(.2,e.pressure*1.6):1;x.lineWidth=w*(tool==='lapis'?.35:1)*pr;x.beginPath();x.moveTo(lx,ly);const mx2=(lx+px)/2,my2=(ly+py)/2;x.quadraticCurveTo(lx,ly,mx2,my2);x.stroke();lx=mx2;ly=my2}
  else if(tool==='spray'){for(let i=0;i<24;i++){const a=Math.random()*6.28,r=Math.random()*w*2.2;x.fillRect(px+Math.cos(a)*r,py+Math.sin(a)*r,2,2)}}
  else{x.putImageData(snap,0,0);setup(e);x.lineWidth=w;x.beginPath();
    if(tool==='linha'){x.moveTo(sx,sy);x.lineTo(px,py);x.stroke()}
    else if(tool.startsWith('ret')){tool==='retc'?x.fillRect(sx,sy,px-sx,py-sy):x.strokeRect(sx,sy,px-sx,py-sy)}
    else{x.ellipse((sx+px)/2,(sy+py)/2,Math.abs(px-sx)/2,Math.abs(py-sy)/2,0,0,7);tool==='elipsec'?x.fill():x.stroke()}}};
cv.onpointerup=()=>{down=false;x.globalAlpha=1};
$('#undo').onclick=()=>{const h=undo.pop();if(h){redo.push(snapNow());x.putImageData(h,0,0)}};
$('#redo').onclick=()=>{const h=redo.pop();if(h){undo.push(snapNow());x.putImageData(h,0,0)}};
$('#clear').onclick=()=>{push();fillWhite()};
$('#artist').onclick=()=>$('#studio').classList.add('open');$('#close').onclick=()=>$('#studio').classList.remove('open');
$('#save').onclick=()=>{const a={title:$('#tt').value.trim()||'Sem título',author:$('#au').value.trim()||'Autor anônimo',style:$('#fs').value,img:cv.toDataURL('image/jpeg',.82)};
  const s=load();s.push(a);if(!persist(s)){alert('Não foi possível salvar: o armazenamento do navegador está cheio. Apague obras antigas ou use outro navegador.');return}
  $('#studio').classList.remove('open');undo=[];redo=[];fillWhite();$('#tt').value='';build();unfocus();tz=Math.max(minZ(),arts[arts.length-1].g.userData.z+HOME-1)};
</script></body></html>
